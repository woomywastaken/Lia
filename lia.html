<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lia</title>
<style>
:root{color-scheme:dark;--bg:#111113;--s1:#18191b;--s2:#212225;--line:#2e3135;--text:#edeef0;--mute:#b0b4ba;--low:#30a46c;--med:#ffc53d;--high:#e5484d;
 --lowbg:#132d21;--lowbd:#28684a;--lowtx:#3dd68c;--medbg:#302008;--medbd:#714f19;--medtx:#ffca16;--highbg:#3b1219;--highbd:#8c333a;--hightx:#ff9592;
 --ui:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 var(--ui);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{font-size:12px;letter-spacing:.32em;font-weight:600;flex:1}
#dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}#dot.ok{background:var(--low)}#dot.bad{background:var(--high)}
.pill-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--mute)}
.pill-btn kbd{font:11px var(--ui);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
#alert{display:none;margin:0 20px 8px;padding:12px 16px;border-radius:12px;background:var(--high);color:#2a0610;font-weight:600}#alert.on{display:block}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:28px;padding:0 20px 14px}
main.has{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
#chat{display:flex;flex-direction:column;min-height:0;height:100%;width:100%;max-width:700px;margin:0 auto}
main.has #chat{margin:0;max-width:none}
#chat:not(.docked){justify-content:center}
#orbwrap{position:relative;flex:0 0 auto;height:clamp(190px,34vh,320px);transition:height .7s cubic-bezier(.3,.7,.2,1)}
#chat.docked #orbwrap{height:92px}
#orb{position:absolute;inset:0;width:100%;height:100%}
#hello{text-align:center;font:400 clamp(24px,3.4vw,32px)/1.2 var(--serif);letter-spacing:-.01em;margin:2px 0 22px;max-height:90px;overflow:hidden;transition:max-height .5s,opacity .4s,margin .5s}
#chat.docked #hello{max-height:0;opacity:0;margin:0}
#log{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:4px 2px 12px}
#chat:not(.docked) #log{flex:0 0 0}
.msg{max-width:88%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--s2);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:9px 14px}
.msg.l{font-size:17px}.msg.e{color:var(--high)}
.meta{display:block;font-size:12px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
.dots span{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-3px);opacity:.4}}
#comp{display:flex;flex-direction:column;gap:10px}
#vit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
#chat.docked #vit{display:none}
#vit label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--s1)}
#vit input{width:54px;background:none;border:0;padding:0;color:var(--text);font-variant-numeric:tabular-nums}#vit input:focus-visible{outline:0}
.chip{border:1px solid var(--line);background:none;border-radius:10px;padding:6px 12px;font-size:13px;color:var(--text);margin-left:auto}
form{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
form:focus-within{border-color:rgba(255,255,255,.35)}
input#in{flex:1;min-width:0;background:none;border:0;padding:8px 6px}input#in:focus-visible{outline:0}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:none;color:var(--mute)}
.ib[aria-pressed=true]{background:var(--text);color:var(--bg)}
.send{width:40px;height:40px;border-radius:12px;border:0;background:var(--text);color:var(--bg);font-size:18px;font-weight:700}
button:disabled,input:disabled{opacity:.4;cursor:default}
.note{font-size:12.5px;color:var(--mute);margin:0;text-align:center}
#res{display:none;overflow-y:auto;flex-direction:column;gap:12px;padding-top:12px}main.has #res{display:flex}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.care{border-color:var(--high)}
.card b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;color:#111}
.low{background:var(--low)}.medium{background:var(--med)}.high{background:var(--high)}
ol,ul{margin:8px 0 0;padding-left:20px}li{margin:5px 0}
.btn2{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 14px;font-size:14px}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5}#scrim.on{display:block}
#pal{display:none;position:fixed;inset:0;z-index:8;align-items:flex-start;justify-content:center;padding-top:16vh;background:rgba(0,0,0,.55)}#pal.on{display:flex}
#pal .box{width:min(480px,92vw);background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #000}
#pq{width:100%;box-sizing:border-box;background:none;border:0;border-bottom:1px solid var(--line);padding:16px;font-size:16px}#pq:focus-visible{outline:0}
#pl{list-style:none;margin:0;padding:6px}#pl li{margin:0;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between}
#pl li.sel{background:var(--s2)}#pl small{color:var(--mute)}
#sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:80vh;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;z-index:9;padding:8px 20px 28px;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.3,.8,.2,1);box-sizing:border-box}
#sheet.on{transform:translate(-50%,0)}
#grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px;touch-action:none;cursor:grab}
#sheet h2{font:400 24px var(--serif);margin:0 0 14px}
.hist{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--s2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 18px;border:0;background:none}.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.dt{display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 4px 4px 0}
svg.sp{width:100%;height:auto;color:var(--text);overflow:visible}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:12;pointer-events:none}
.toast{background:var(--text);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:14px;animation:ti .25s}.toast.out{opacity:0;transition:opacity .4s}
@keyframes ti{from{transform:translateY(10px);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#ph{display:none}
@media (max-width:820px){main.has{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
@media (prefers-reduced-motion:reduce){#orbwrap,#hello,#sheet{transition:none}.dots span,.toast{animation:none}}
@media print{
 body{background:#fff;color:#000;display:block;font-size:12pt}
 header,#chat,#scrim,#pal,#sheet,#toasts,#alert,.noprint{display:none!important}
 main,main.has{display:block;padding:0}#res{display:flex!important;overflow:visible}#ph{display:block}
 .card{background:#fff;border:1px solid #888;color:#000;break-inside:avoid}.card b,.note{color:#333}
 .pill{background:#fff!important;border:1px solid #000;color:#000}}
#res{padding:6px 6px 28px;gap:22px;container-type:inline-size}   /* fills all the room beside the chat */
.hero{border:1px solid var(--line);border-radius:18px;padding:22px 24px;background:var(--s1)}
.hero.low{background:var(--lowbg);border-color:var(--lowbd);color:var(--lowtx)}
.hero.medium{background:var(--medbg);border-color:var(--medbd);color:var(--medtx)}
.hero.high{background:var(--highbg);border-color:var(--highbd);color:var(--hightx)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hero h2{font:400 clamp(28px,3.4vw,38px)/1.1 var(--serif);margin:6px 0 6px;color:var(--text)}
.hero p{margin:0;color:var(--mute);font-size:14.5px}
.tiles{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.tile{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:110px}
.tile small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tile span{font:500 26px var(--ui);color:var(--text);font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:13px;color:var(--mute);margin-left:4px}
.cols{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@container (min-width:620px){.cols{grid-template-columns:1fr 1fr}.cols .warn{grid-column:1/-1}}
@container (min-width:1000px){.cols{grid-template-columns:1fr 1fr 1fr}.cols .warn{grid-column:auto}}
.blk h3 small{font-weight:400;letter-spacing:.04em;text-transform:none;margin-left:6px}
.blk h3,.warn h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 12px}
.ranked,.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ranked li{display:flex;gap:12px;align-items:baseline;margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
.ranked li:first-child{border-color:#5a6169}
.rk{font:400 20px var(--serif);color:var(--mute);min-width:18px}
.cz{display:flex;flex-direction:column;gap:2px}.cz small{font-size:12px;color:var(--mute)}
.ranked li:first-child .cz small{color:var(--text)}
[hidden]{display:none!important}
#mode{font-size:12.5px;color:var(--mute)}#mode.bad{color:var(--hightx)}
#fr:not([hidden])+#ex{margin-left:0}
#cam{display:block;width:min(100%,400px);margin:0 auto;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#000;transform:scaleX(-1)}
#fs{margin:10px 0 14px;min-height:20px;text-align:left;font-size:14px;color:var(--text)}
.txt{flex:1;min-width:0;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.crew{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.checks li{margin:0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:20px;height:20px;margin:1px 0 0;border:1.5px solid #5a6169;border-radius:6px;display:grid;place-content:center;background:none}
.chk input:checked{background:var(--text);border-color:var(--text)}
.chk input:checked::after{content:"\2713";color:var(--bg);font-size:14px;font-weight:700}
.chk input:checked+span{color:var(--mute);text-decoration:line-through}
.warn{border:1px solid var(--medbd);background:var(--medbg);border-radius:14px;padding:16px 18px}
.warn h3{color:var(--medtx)}.warn ul{margin:0;padding-left:20px}
.carebox{border:1px solid var(--highbd);background:var(--highbg);color:var(--hightx);border-radius:14px;padding:14px 18px}
details.heard{border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--mute);font-size:14px}
details.heard summary{cursor:pointer}details.heard p{margin:8px 0 0}
@media print{.hero,.warn,.carebox,.ranked li,.chk,.tile{background:#fff!important;color:#000!important;border:1px solid #888!important}.hero h2,.tile span{color:#000!important}details.heard{display:none}}

*{scrollbar-width:thin;scrollbar-color:#3b3e44 transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3b3e44;border-radius:99px;border:2.5px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#55595f;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
#vit{display:block}
.vgroup{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.vlab{font-size:12.5px;color:var(--mute);min-width:84px;padding-top:9px}
.vg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:8px 10px;color:var(--text)}
.cat b{font-size:13.5px;font-weight:600}
.cat small{font-size:12px;color:var(--mute)}
.cat.on{border-color:var(--text);background:var(--s2)}
.seg button.on{background:var(--text);color:var(--bg)}
textarea.txt{font:inherit;color:inherit}
#pcam{display:block;width:min(100%,400px);margin:0 auto;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#000}
.chip.on{border-color:var(--low);color:var(--low)}
.msg img{max-width:200px;border-radius:10px;display:block}
#comp{position:relative}
#vit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px;font-size:12.5px;color:var(--mute)}
#vit select{appearance:none;-webkit-appearance:none;background-color:var(--s1);background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;border:1px solid var(--line);color:var(--mute);border-radius:9px;padding:5px 26px 5px 10px;font:inherit;font-size:12.5px;max-width:46vw}
#vit select.filled{color:var(--text);border-color:#5a6169}
#vit select option{background:#18191b;color:#eceef1}
#vit.nudge select:not(.filled){border-color:var(--med);color:var(--text)}
#vit.nudge #vhint{color:var(--med)}
#vhint{flex:1;min-width:140px}
#plus{position:absolute;left:0;bottom:62px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:210px;box-shadow:0 14px 40px #000;z-index:4}
#plus[hidden],#plus [hidden]{display:none}
#plus .pi{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:var(--text);font-size:14.5px;cursor:pointer}
#plus .pi:hover,#plus .pi:focus-visible{background:var(--s2)}#plus .pi.on{color:var(--low)}
#pl li.grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);cursor:default;padding:10px 12px 4px}
#vit{display:block;margin:0 0 6px}
#vit .vgroup{margin-bottom:5px}
#vit .vlab{min-width:74px;padding-top:6px;font-size:12px}
#vit .vg{grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px}
#vit .cat{padding:5px 9px;border-radius:10px}
#vit .cat b{font-size:12.5px}#vit .cat small{font-size:10.5px}
#vit.nudge .cat:not(.on){border-color:var(--med)}
#vhint{margin:2px 0 0;font-size:12px;color:var(--mute)}
#vit.nudge #vhint{color:var(--med)}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes riseL{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes riseR{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes glowHigh{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}50%{box-shadow:0 0 26px 2px rgba(229,72,77,.28)}}
@keyframes tick{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.msg.l{animation:riseL .4s cubic-bezier(.2,.8,.2,1) both}
.msg.u{animation:riseR .35s cubic-bezier(.2,.8,.2,1) both}
.msg.e{animation:rise .3s both}
#hello{animation:rise .8s .15s both}
#res>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#res>*:nth-child(2){animation-delay:.08s}#res>*:nth-child(3){animation-delay:.16s}#res>*:nth-child(4){animation-delay:.24s}
#res>*:nth-child(5){animation-delay:.32s}#res>*:nth-child(6){animation-delay:.4s}#res>*:nth-child(n+7){animation-delay:.48s}
#res>.hero.high{animation:rise .55s both,glowHigh 2.6s 1s infinite}
.cat.on{animation:pop .25s}
#plus:not([hidden]){animation:popIn .16s ease-out}
#mic[aria-pressed=true]{animation:ring 1.6s infinite}
.chk input:checked::after{animation:tick .22s cubic-bezier(.3,1.6,.5,1)}
button,.cat,.card{transition:transform .12s,border-color .2s,background .2s,color .2s}
button:active,.cat:active{transform:scale(.96)}
.send:hover{transform:translateY(-1px)}
}
</style>
</head>
<body>
<header>
  <span class="logo">LIA</span>
  <span id="mode"></span>
  <span id="dot" title="Connecting…"></span>
  <button class="pill-btn" id="who" hidden title="Sign out"></button>
  <button class="pill-btn" id="menu" aria-label="Open menu">Menu <kbd>Ctrl K</kbd></button>
</header>
<div id="alert" role="alert"></div>
<main id="main">
  <section id="chat">
    <div id="orbwrap"><canvas id="orb" aria-hidden="true"></canvas></div>
    <p id="hello"></p>
    <div id="log" aria-live="polite"></div>
    <div id="comp">
      <div id="vit">
        <div class="vgroup"><span class="vlab">Temperature</span><div class="vg" id="tg"></div></div>
        <div class="vgroup"><span class="vlab">Pulse</span><div class="vg" id="pg"></div></div>
        <p id="vhint">Optional, but it helps Lia a lot.</p>
      </div>
      <form id="f">
        <button class="ib" id="pbtn" type="button" aria-label="More: photo, watch, example" aria-expanded="false" title="More"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib" id="mic" type="button" aria-pressed="false" aria-label="Voice conversation" title="Voice conversation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="ib" id="ph" type="button" aria-label="Add a photo" title="Add a photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <input id="in" autocomplete="off" aria-label="Message to Lia">
        <button class="send" id="send" aria-label="Send">↑</button>
      </form>
      <div id="plus" hidden>
        <button type="button" class="pi" id="pph">Add a photo</button>
        <button type="button" class="pi" id="wb">Connect watch</button>
        <button type="button" class="pi" id="ex">Try an example</button>
        <button type="button" class="pi" id="fr" hidden>Recognize me</button>
      </div>
      <p class="note">Someone seriously ill? Alert the crew commander now. Don't wait for Lia.</p>
    </div>
  </section>
  <section id="res" aria-label="Results"></section>
</main>
<div id="ph"></div>
<div id="scrim"></div>
<div id="pal"><div class="box"><input id="pq" placeholder="Type a command…" aria-label="Search commands"><ul id="pl"></ul></div></div>
<div id="sheet" role="dialog" aria-modal="true"><div id="grab"></div><div id="sbody"></div></div>
<div id="toasts" aria-live="polite"></div>
<script src="/static/number-flow.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;$("toasts").append(d);setTimeout(()=>d.classList.add("out"),2600);setTimeout(()=>d.remove(),3100)}

/* ---------- orb: a calm, noisy wireframe sphere ---------- */
const orb=(()=>{
  const cv=$("orb"),cx=cv.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lines=[],M=40,N=40,P=24,Q=60,pi=Math.PI;
  for(let i=0;i<M;i++){const ph=2*pi*i/M,l=[];for(let j=0;j<=N;j++){const th=pi*j/N;l.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)])}lines.push(l)}
  for(let k=1;k<P;k++){const th=pi*k/P,l=[];for(let j=0;j<=Q;j++){const ph=2*pi*j/Q;l.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)])}lines.push(l)}
  const dots=Array.from({length:RM?60:200},()=>({a:Math.random()*6.283,r:1.08+Math.random()*.3,p:Math.random()*6.283}));
  /* gentle on purpose: small changes only */
  const S={idle:{amp:.05,spin:.08,hA:215,hB:285,glow:.45,sc:1},typing:{amp:.052,spin:.085,hA:212,hB:287,glow:.5,sc:1},
    listen:{amp:.07,spin:.1,hA:195,hB:290,glow:.6,sc:1.02},think:{amp:.09,spin:.17,hA:220,hB:300,glow:.65,sc:.98},
    low:{amp:.05,spin:.07,hA:175,hB:235,glow:.5,sc:1},medium:{amp:.07,spin:.1,hA:40,hB:305,glow:.6,sc:1},high:{amp:.1,spin:.14,hA:-10,hB:330,glow:.75,sc:1.01}};
  let state="idle",base="idle",cur={...S.idle},kick=0,w0=0,last=performance.now(),t=0,W=0,H=0,dpr=1,tt=0;
  new ResizeObserver(()=>{const r=cv.getBoundingClientRect();dpr=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}).observe(cv);
  const AL=[.9,.5,.2];
  function frame(now){
    const dt=Math.min(.05,(now-last)/1e3);last=now;t+=dt*(RM?.2:1);
    const tg={...S[state]};let w=0;
    if(state==="think"){w=Math.min(1,(now-w0)/15000);tg.amp+=.03*w;tg.spin+=.08*w;tg.hA+=25*w;tg.hB+=12*w}
    const k=1-Math.exp(-dt*1.2);for(const key in tg)cur[key]+=(tg[key]-cur[key])*k;
    kick*=Math.exp(-dt*1.6);
    cx.clearRect(0,0,W,H);
    const R=Math.min(W,H)*.3*(cur.sc+(RM?0:.04*kick));   /* sphere + glow stay inside the canvas, so nothing is cut off */
    const ox=W/2+(RM?0:Math.sin(t*.3)*W*.012),oy=H/2+(RM?0:Math.cos(t*.23)*H*.012);
    const A=cur.amp+(RM?0:.02*kick),nt=t*(.5+cur.spin*1.5),rY=t*cur.spin*2,rX=.35+Math.sin(t*.15)*.06;
    const cY=Math.cos(rY),sY=Math.sin(rY),cX=Math.cos(rX),sX=Math.sin(rX);
    cx.globalCompositeOperation="lighter";
    let g=cx.createRadialGradient(ox,oy,R*.2,ox,oy,R*1.6);
    g.addColorStop(0,`hsla(${cur.hA},100%,60%,${.2*cur.glow})`);g.addColorStop(1,`hsla(${cur.hB},100%,50%,0)`);
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    g=cx.createRadialGradient(ox+R*.4,oy+R*.45,0,ox+R*.4,oy+R*.45,R*.9);
    g.addColorStop(0,`hsla(${cur.hB},100%,60%,${.18*cur.glow})`);g.addColorStop(1,`hsla(${cur.hB},100%,50%,0)`);
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    const B=[0,1,2].map(()=>Array.from({length:10},()=>new Path2D()));
    for(const l of lines){
      let px0=0,py0=0,pz0=0,pm0=0;
      for(let j=0;j<l.length;j++){
        const v=l[j],n=.5*Math.sin(2.3*v[0]+1.7*v[1]+1.1*nt)+.3*Math.sin(3.7*v[1]-2.1*v[2]-.9*nt)+.2*Math.sin(5.1*v[2]+3.3*v[0]+1.4*nt);
        const r=1+A*n,x=v[0]*r,y=v[1]*r,z=v[2]*r,x1=x*cY+z*sY,z1=-x*sY+z*cY,y1=y*cX-z1*sX,z2=y*sX+z1*cX,f=6/(6-z2);
        const px=ox+x1*R*f,py=oy-y1*R*f,m=.5+.35*x1-.35*y1+.2*n;
        if(j){const dz=(pz0+z2)/2,d=dz>.3?0:dz>-.3?1:2,b=Math.max(0,Math.min(9,Math.floor((pm0+m)*5))),p=B[d][b];p.moveTo(px0,py0);p.lineTo(px,py)}
        px0=px;py0=py;pz0=z2;pm0=m;
      }
    }
    cx.lineWidth=.8;
    for(const d of [2,1,0])for(let b=0;b<10;b++){cx.strokeStyle=`hsla(${cur.hA+(cur.hB-cur.hA)*b/9},95%,64%,${AL[d]})`;cx.stroke(B[d][b])}
    for(const d of dots){
      const a=d.a+t*.02,rad=R*(d.r+A*.4*Math.sin(t*.7+d.p)),m=.5+.5*Math.sin(a+.8),s=Math.sin(t*1.2+d.p);
      cx.fillStyle=`hsla(${cur.hA+(cur.hB-cur.hA)*m},95%,70%,${.22+.3*s*s})`;
      cx.fillRect(ox+Math.cos(a)*rad,oy+Math.sin(a)*rad,1.5,1.5);
    }
    cx.globalCompositeOperation="source-over";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return{
    typing(){if(state!=="idle"&&state!==base)return;state="typing";clearTimeout(tt);tt=setTimeout(()=>{if(state==="typing")state=base},1500)},
    think(){state="think";w0=performance.now()},
    listen(on){if(on)state="listen";else if(state==="listen")state=base},
    done(level){if(level)base=level;state=base;kick=1},
    reset(){base=state="idle"}
  };
})();

/* ---------- state ---------- */
let sid=null,busy=false,done=false,unit="F",info="",stt=false,first="",vit={},voiceOn=false,speaking=false,rec=null,demoQ=[],noVoiceWarned=false,tts=false,speakId=0,curAudio=null,ttsFail=false,face=false,who="",cam=null,camBusy=false;

async function api(path,body){
  const r=await fetch(path,{method:body===undefined?"GET":"POST",headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===404&&path==="/photo")throw new Error("This copy of Lia's server doesn't have photo support yet. Replace server.py with the newest one and restart Lia.");const d=j.detail;throw new Error(typeof d==="string"?d:("Server error "+r.status))}
  return j;
}

    if(!h.ok){d.className="bad";info="Model not reachable. "+(h.error||"");md.textContent="Model offline: start LM Studio's server";md.className="bad"}

async function start(){
  sid=null;done=false;busy=true;first="";vit={};demoQ=[];lock();orb.reset();stopVoice();
  $("log").innerHTML="";$("res").innerHTML="";$("main").classList.remove("has");$("chat").classList.remove("docked");

/* ---------- sending, timing ---------- */
function submit(text){
  text=text.trim();if(!text||busy||done||!sid)return;
  if(!first&&!nudged&&!voiceOn&&pick.t===null&&pick.p===null&&!bpm&&!/breath|chest|bleed|unconscious|seiz|faint|collaps|overdos|poison|chok|suicid|hopeless|can'?t/i.test(text)){
    nudged=true;$("vit").classList.add("nudge");$("vhint").textContent="Pick a temperature and pulse if you can. It helps a lot. Send again to skip.";$("in").value=text;$("in").focus();return}   /* never delays an emergency or a voice message */
  $("in").value="";let sent=text,meta="";
  if(!first){
    first=text;const v=getVit(),parts=[];
    if(v.tc!=null){parts.push("Temperature: "+tlabel(pick.t));vit.tc=v.tc}
    if(v.p!=null){parts.push("Pulse: "+(bpm?bpm+" bpm (watch)":plabel(pick.p)));vit.p=v.p}
    if(parts.length)meta=parts.join(" · ");
  }
  $("chat").classList.add("docked");
  const m=add("u",text);if(meta){const s=document.createElement("small");s.className="meta";s.textContent=meta;m.append(s)}
  step("/reply",{session_id:sid,text:sent,temp_c:vit.tc??null,pulse:vit.p??null});
}
async function step(path,body){
  busy=true;lock();orb.think();
  const t=document.createElement("div");t.className="msg l";
  t.innerHTML='<span class="dots"><span></span><span></span><span></span></span><small class="meta" style="display:inline;margin-left:8px">0.0 s</small>';
  $("log").append(t);$("log").scrollTop=1e9;
  const t0=performance.now(),iv=setInterval(()=>{t.querySelector("small").textContent=((performance.now()-t0)/1e3).toFixed(1)+" s"},100);
  try{
    const r=await api(path,body),secs=((performance.now()-t0)/1e3).toFixed(1);t.remove();
    if(r.type==="question"){
      const m=add("l",r.text),s=document.createElement("small");s.className="meta";s.textContent=secs+" s";m.append(s);orb.done();
      if(demoQ.length)setTimeout(()=>submit(demoQ.shift()),1500);else speak(r.text,pttOn()?null:listen);
    }else{
      done=true;showResult(r.result,vit,true);save(r.result);orb.done(r.result.urgency);
      const m=add("l","My results are next to our chat. Please follow the next steps, and tell the crew commander if you are worried."),s=document.createElement("small");
      s.className="meta";s.textContent=secs+" s";m.append(s);speak(spoken(r.result),()=>{if(voiceOn)setVoice(false)});
    }
  }catch(e){t.remove();add("e",e.message);orb.done();toast("Something went wrong")}
  clearInterval(iv);busy=false;lock();if(!done)$("in").focus();
}
$("in").oninput=()=>{demoQ=[];orb.typing()};
$("f").onsubmit=e=>{e.preventDefault();submit($("in").value)};

const LBL={low:"Low urgency",medium:"Medium urgency",high:"Urgent: act now"};
const rankWord=(i,n)=>i===0?"Most likely":i===n-1?"Least likely of these":"Next most likely";   /* the order is the model's ranking */
const li=(a,fb)=>(a&&a.length?a:[fb]).map(x=>"<li>"+esc(x)+"</li>").join("");
function transcriptHTML(tr){
  const rows=Array.isArray(tr)?tr.map(x=>[x.u,x.t]):tr===true?[...$("log").children].filter(m=>m.classList.contains("msg")&&m.firstChild).map(m=>[m.classList.contains("u"),m.firstChild.textContent]):[];

function showResult(r,v,tr){
  v=v||vit;
  $("main").classList.add("has");$("chat").classList.add("docked");
  const tiles=[];
  if(v&&v.tc!=null){const t=unit==="F"?v.tc*9/5+32:v.tc;tiles.push('<div class="tile"><small>Temperature</small><span><number-flow data-v="'+t.toFixed(1)+'" data-f="1"></number-flow><em>°'+unit+"</em></span></div>")}
  if(v&&v.p)tiles.push('<div class="tile"><small>Pulse</small><span><number-flow data-v="'+Math.round(v.p)+'"></number-flow><em>bpm</em></span></div>');
  const said=transcriptHTML(tr);
  const causes=r.conditions&&r.conditions.length?r.conditions:["Lia could not name a cause. Please tell the crew commander."];
  const steps=r.next_steps&&r.next_steps.length?r.next_steps:["Tell the crew commander."];
  const named=r.conditions?r.conditions.length:0;
  const danger=(r.rules_fired||[]).filter(x=>x.startsWith("dangerous possibility: ")).map(x=>x.slice(23));
  $("res").innerHTML=
   '<div class="hero '+esc(r.urgency)+'"><span class="eyebrow">Assessment</span><h2>'+esc(LBL[r.urgency]||r.urgency)+"</h2><p>"+
     (r.rules_raised?"Safety rules raised this level: "+esc((r.rules_fired||[]).join("; ")):"Based on what you told me. These are possibilities, not a diagnosis.")+"</p>"+
     (tiles.length?'<div class="tiles">'+tiles.join("")+"</div>":"")+"</div>"+
   (r.care_note?'<div class="carebox">'+esc(r.care_note)+"</div>":"")+(r.photo_note?'<div class="card"><b>From your photo</b><p style="margin:8px 0 0">'+esc(r.photo_note)+'</p><p class="note" style="text-align:left">Experimental. A photo cannot diagnose anything and Lia can misread it.</p></div>':"")+(r.known_profile&&r.known_profile.length?'<div class="card"><b>Health profile used</b><p class="note" style="text-align:left;margin-top:6px">'+esc(r.known_profile.join(" · "))+"</p></div>":"")+
   '<div class="cols"><section class="blk"><h3>Possible causes'+(named>1?"<small>most likely first</small>":"")+'</h3><ol class="ranked">'+causes.map((c,i)=>'<li><span class="rk">'+(i+1)+'</span><span class="cz"><span>'+esc(c)+"</span>"+(named>1?"<small>"+rankWord(i,named)+(i&&danger.some(k=>c.toLowerCase().includes(k))?" · but serious if true, so it raises the urgency":"")+"</small>":"")+"</span></li>").join("")+"</ol></section>"+
   '<section class="blk"><h3>What to do now</h3><ul class="checks">'+steps.map(x=>'<li><label class="chk"><input type="checkbox"><span>'+esc(x)+"</span></label></li>").join("")+"</ul></section>"+
   '<section class="warn"><h3>Call the commander if</h3><ul>'+li(r.call_commander_if,"You feel worse.")+"</ul></section></div>"+
   (said?'<details class="heard"><summary>What I heard</summary>'+said+"</details>":"")+
   '<p class="note" style="text-align:left">'+esc(r.disclaimer||"Lia is an AI helper, not a doctor.")+'</p><div class="noprint"><button class="btn2" onclick="printSummary()">Print or save summary</button> <button class="btn2" onclick="start()">New check</button></div>';
  document.querySelectorAll("#res number-flow").forEach(el=>{
    const val=+el.dataset.v,txt=el.dataset.v;
    if(!customElements.get("number-flow")){el.textContent=txt;return}
    try{if(el.dataset.f)el.format={minimumFractionDigits:1,maximumFractionDigits:1};el.update(0);setTimeout(()=>{try{el.update(val)}catch(e){el.textContent=txt}},120)}catch(e){el.textContent=txt}
  });

  else a.classList.remove("on");
}

const ACTIONS=[["New check","This check",start],["Add a photo","This check",()=>openPhoto()],["Connect watch","This check",()=>connectWatch()],["Try an example","This check",example],["Print or save summary","This check",printSummary],["Previous checks","You",()=>sheet("hist")],["Health over time","You",()=>sheet("time")],["Health profile","You",()=>sheet("profile")],["Who is this? (camera)","You",()=>sheet("face")],["Settings","You",()=>sheet("set")]];

  const q=$("pq").value.toLowerCase();shown=ACTIONS.filter(a=>a[0].toLowerCase().includes(q));sel=Math.min(sel,Math.max(0,shown.length-1));
  let last="";
  $("pl").innerHTML=shown.map((a,i)=>{let h="";if(!q&&a[1]!==last){last=a[1];h='<li class="grp">'+esc(a[1])+"</li>"}return h+'<li class="'+(i===sel?"sel":"")+'" data-i="'+i+'">'+esc(a[0])+"</li>"}).join("");
}
function runPal(i){const a=shown[i];if(a){palette(false);a[2]()}}

  if(e.key==="ArrowDown"){sel=Math.min(sel+1,shown.length-1);renderPal();e.preventDefault()}

/* ---------- face sign-in: the camera picture goes only to your own server, which keeps a face print, never the picture ---------- */
/* Lia never scans by itself. Someone presses "Scan my face", and after each sign-in there is a short cooldown,
   so the next person in front of the camera is not signed in by accident. */
const COOL_MS=8000;let faceCool=0,coolT=null;
function setWho(name){
  who=name;const b=$("who");b.hidden=!name;b.textContent=name?name+"  ✕":"";
  $("fr").textContent=name?"Switch user":"Recognize me";
  if(name)faceCool=Date.now()+COOL_MS;
  if(!first&&!done)start();
}
$("who").onclick=()=>{setWho("");toast("Signed out")};
$("fr").onclick=()=>sheet("face");
const fsay=m=>{const e=$("fs");if(e)e.textContent=m};
function coolLeft(){return Math.max(0,Math.ceil((faceCool-Date.now())/1000))}
function coolTick(){
  const b=$("fscan");if(!b)return;
  const s=coolLeft();b.disabled=camBusy||s>0;b.textContent=s>0?"Wait "+s+" s":"Scan my face";
  if(s===0&&coolT){clearInterval(coolT);coolT=null}
}
function startCool(){if(!coolT)coolT=setInterval(coolTick,500);coolTick()}
async function camStart(){
  let st;
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false})}
  catch(e){fsay("Camera blocked or unavailable. Allow the camera for this page and try again.");return}
  const v=$("cam");if(!v||!sh.classList.contains("on")){st.getTracks().forEach(t=>t.stop());return}
  camStop();v.srcObject=st;try{await v.play()}catch(e){}
  cam={st};fsay("Stand in front of the camera, then press Scan my face.");startCool();
}
function camStop(){if(pstream){pstream.getTracks().forEach(t=>t.stop());pstream=null}if(!cam)return;cam.st.getTracks().forEach(t=>t.stop());cam=null;camBusy=false;if(coolT){clearInterval(coolT);coolT=null}}
function snap(){
  const v=$("cam");if(!v||!v.videoWidth)return Promise.resolve(null);
  const c=document.createElement("canvas"),k=Math.min(1,480/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,"image/jpeg",.85));
}
async function sendFace(path,blob){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob}),j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:"Face recognition failed");
  return j;
}
async function scanOnce(){
  if(!cam||camBusy)return;
  if(coolLeft()>0){fsay("Please wait a moment before the next scan.");return}
  camBusy=true;coolTick();fsay("Scanning…");const mine=cam;let r=null;
  try{
    for(let i=0;i<3&&cam===mine;i++){           /* a few tries, since one picture can miss */
      const b=await snap();if(!b)break;
      r=await sendFace("/face/identify",b);
      if(r.match)break;
      await new Promise(res=>setTimeout(res,350));
    }
    if(cam!==mine)return;
    if(r&&r.match){closeSheet();setWho(r.name);toast("Welcome back, "+r.name);return}
    fsay(!r?"The camera is not ready yet. Try again.":r.face?"I can see you, but I don't know you yet. Type your name below to add your face.":r.message);
  }catch(e){if(cam===mine)fsay(e.message)}
  camBusy=false;coolTick();
}
async function enroll(){
  const name=$("fn").value.trim();
  if(!name){fsay("Type your name first.");$("fn").focus();return}
  if(!cam){fsay("The camera is not on.");return}
  if(camBusy)return;
  const mine=cam;camBusy=true;$("fa").disabled=true;let saved=0,err="";
  for(let i=0;i<4&&cam===mine;i++){          /* a few pictures, a moment apart, give a steadier face print */
    fsay("Hold still… picture "+(i+1)+" of 4");
    try{const b=await snap();if(b){await sendFace("/face/enroll?name="+encodeURIComponent(name),b);saved++}}catch(e){err=e.message}
    await new Promise(r=>setTimeout(r,450));
  }
  if(cam!==mine)return;
  if(saved>=2){closeSheet();setWho(name);toast("Saved. Hello, "+name+"!")}
  else{fsay(err||"I couldn't get a clear picture. Try again with more light.");const f=$("fa");if(f)f.disabled=false;camBusy=false;coolTick()}
}
async function crewList(){
  const box=$("fc");if(!box)return;
  try{
    const c=(await api("/face/crew")).crew;
    box.innerHTML=c.length?c.map(n=>'<div class="crew"><span>'+esc(n)+'</span><button class="btn2" data-n="'+esc(n)+'">Remove</button></div>').join(""):'<p class="note" style="text-align:left">Nobody yet.</p>';
    box.querySelectorAll("[data-n]").forEach(b=>b.onclick=async()=>{
      const n=b.dataset.n;if(!confirm("Remove "+n+"'s face print from this computer?"))return;
      try{const r=await fetch("/face/crew?name="+encodeURIComponent(n),{method:"DELETE"});if(!r.ok)throw 0;if(who===n)setWho("");toast("Removed "+n);crewList()}catch(e){toast("Could not remove "+n)}
    });
  }catch(e){box.innerHTML='<p class="note" style="text-align:left">Could not load the list.</p>'}
}

/* ---------- voice: speech recognition runs on your computer (server), speech uses offline voices only ---------- */
function setVoice(on){
  if(on&&!stt){toast("Voice needs offline speech recognition: pip install faster-whisper");return}
  voiceOn=on;$("mic").setAttribute("aria-pressed",on);
  if(!on){stopVoice();toast("Voice off");return}
  toast(pttOn()?"Voice on. Hold "+keyLabel()+" to talk.":"Voice on. Just talk when Lia is listening.");
  if(first)listen();else speak($("hello").textContent,listen);
}
function stopVoice(){
  voiceOn=false;pttHeld=false;speakId++;const m=$("mic");if(m)m.setAttribute("aria-pressed","false");
  if(rec)rec.cancel();if(curAudio){curAudio.pause();curAudio=null}
  if("speechSynthesis" in window)speechSynthesis.cancel();speaking=false;orb.listen(false);
}
$("mic").onclick=()=>setVoice(!voiceOn);
function basicVoice(text,then){
  if(!("speechSynthesis" in window)){then&&then();return}
  const vs=speechSynthesis.getVoices().filter(v=>v.localService&&/^en/i.test(v.lang));
  if(!vs.length){if(!noVoiceWarned){toast("No offline voice available, so Lia will not speak aloud.");noVoiceWarned=true}then&&then();return}
  const u=new SpeechSynthesisUtterance(text);u.voice=vs[0];u.onend=u.onerror=()=>{speaking=false;then&&then()};
  speaking=true;speechSynthesis.speak(u);
}
async function speak(text,then){
  if(!voiceOn){then&&then();return}
  if(ttsFail||!tts){basicVoice(text,then);return}
  const id=++speakId,parts=(text.match(/[^.!?]+[.!?]*/g)||[text]).map(x=>x.trim()).filter(Boolean);
  const get=x=>fetch("/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:x})}).then(r=>{if(!r.ok)throw new Error("tts");return r.blob()});
  speaking=true;
  try{
    let next=get(parts[0]);
    for(let i=0;i<parts.length;i++){
      const blob=await next;if(id!==speakId)return;
      if(i+1<parts.length)next=get(parts[i+1]);          /* prepare the next sentence while this one plays */
      await new Promise(res=>{const a=new Audio(URL.createObjectURL(blob));curAudio=a;a.onended=a.onerror=()=>{URL.revokeObjectURL(a.src);res()};a.play().catch(res)});
      if(id!==speakId)return;
    }
    speaking=false;curAudio=null;then&&then();
  }catch(e){
    if(id!==speakId)return;
    speaking=false;ttsFail=true;toast("Natural voice unavailable, using the basic voice.");basicVoice(text,then);
  }
}
async function listen(manual){
  if(!voiceOn||done)return;
  if(!manual&&pttOn()){if(!pttHinted){pttHinted=true;toast("Hold "+keyLabel()+" to talk")}return}
  if(!manual&&(busy||speaking||rec)){setTimeout(()=>{if(voiceOn&&!done&&!rec&&!pttOn())listen()},400);return}   /* wait for Lia to finish, then listen */
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast("Microphone blocked or unavailable");stopVoice();return}
  if(!voiceOn||rec){stream.getTracks().forEach(t=>t.stop());return}
  orb.listen(true);
  const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaStreamSource(stream),pr=ac.createScriptProcessor(4096,1,1),chunks=[];
  if(ac.resume)ac.resume();
  let heard=false,quiet=0,spoke=0,noise=1,n=0,stopped=false;const t0=performance.now();
  const stop=async(send,again)=>{
    if(stopped)return;stopped=true;pr.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());
    const sr=ac.sampleRate;ac.close();rec=null;orb.listen(false);
    if(!send){if(again&&voiceOn)setTimeout(listen,250);return}
    const len=chunks.reduce((a,c)=>a+c.length,0),all=new Float32Array(len);let o=0;for(const c of chunks){all.set(c,o);o+=c.length}
    const ratio=sr/16000,out=new Int16Array(Math.floor(len/ratio));
    for(let i=0;i<out.length;i++){const a=Math.floor(i*ratio),b=Math.max(a+1,Math.floor((i+1)*ratio));let s=0;for(let j=a;j<b;j++)s+=all[j];out[i]=Math.max(-1,Math.min(1,s/(b-a)))*32767}
    try{
      const r=await fetch("/transcribe",{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:out.buffer}),j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:"Speech recognition failed");
      if(!j.text){toast(manual?"I didn't catch that.":"I didn't catch that. Go ahead.");if(!manual)setTimeout(listen,250);return}
      $("in").value=j.text;submit(j.text);
    }catch(e){if(!/too short/i.test(e.message))toast(e.message);if(!manual)stopVoice()}
  };
  pr.onaudioprocess=e=>{
    const d=e.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));
    if(manual){if(!pttHeld)stop(true,false);return}
    let s=0;for(let i=0;i<d.length;i++)s+=d[i]*d[i];const rms=Math.sqrt(s/d.length),dur=d.length/ac.sampleRate;
    if(n<5){noise=Math.min(noise,rms);n++;return}
    if(rms>Math.min(.05,Math.max(.012,noise*2.5))){heard=true;quiet=0;spoke+=dur}else if(heard)quiet+=dur;
    const el=performance.now()-t0;
    if(heard&&quiet>pauseSec())stop(spoke>.35,spoke<=.35);          /* a click or cough is too short: keep listening */
    else if(el>30000)stop(heard&&spoke>.35,true);
    else if(!heard&&el>12000)stop(false,true);                /* nothing yet: start a fresh listen */
  };
  src.connect(pr);pr.connect(ac.destination);
  rec={cancel:()=>stop(false,false)};
}

/* ---------- live pulse from a Bluetooth heart-rate watch ---------- */
function pulseCat(b){return b<50?"s":b<=100?"n":b<=130?"f":"v"}

async function connectWatch(){

    const dev=await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});

    '<div class="row" style="margin-top:10px;align-items:center"><span>Talk mode</span>'+seg("data-m",[["hands","Hands-free"],["ptt","Push to talk"]],m)+"</div>"+
    '<div class="row" style="margin-top:10px;align-items:center"><span>Push-to-talk key</span><button class="btn2" id="pkey">'+(capturing?"Press a key…":esc(keyLabel()))+"</button></div>"+
    '<div class="row" style="margin-top:10px;align-items:center"><span>Pause before sending (hands-free)</span>'+seg("data-p",[["0.8","0.8 s"],["1.2","1.2 s"],["1.7","1.7 s"]],p)+"</div>"+
    '<p class="note" style="text-align:left;margin-top:8px">Push to talk: hold the key while you speak, then let go. Hands-free: Lia sends what you said after the pause you choose here.</p></div>'+
    '<div class="card" style="margin-top:12px"><div class="row" style="align-items:center"><span>Health profile and earlier checks</span><button class="btn2" id="pgo">Open</button></div></div>';
}
function profileHTML(){
  const p=loadProfiles()[who||"guest"]||{},ctx=localStorage.getItem("lia-ctx")!=="0";
  const f=(id,label,ph,val)=>'<label style="display:block;margin-top:12px"><b style="display:block;margin-bottom:6px;font-size:14px">'+label+'</b><textarea id="'+id+'" rows="2" class="txt" style="width:100%;box-sizing:border-box;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--s2)" placeholder="'+ph+'">'+esc(val||"")+"</textarea></label>";
  return '<h2>Health profile</h2><p class="note" style="text-align:left">For '+esc(who||"guest (no name)")+'. Tell Lia about anything that could change a check. It is kept only on this computer and only used in your checks. Leave blank if none.</p>'+
    f("pf_c","Heart, lung or other ongoing conditions","e.g. heart murmur, asthma",p.conditions)+
    f("pf_a","Allergies","e.g. penicillin, peanuts",p.allergies)+
    f("pf_m","Regular medicines","e.g. blood thinner, insulin",p.medications)+
    f("pf_n","Anything else Lia should know","e.g. broke a wrist last year",p.notes)+
    '<div class="card" style="margin-top:14px"><div class="row" style="align-items:center"><span>Use my earlier checks for context</span><span class="seg"><button data-ctx="1" class="'+(ctx?"on":"")+'">On</button><button data-ctx="0" class="'+(ctx?"":"on")+'">Off</button></span></div><p class="note" style="text-align:left;margin-top:8px">Lia may mention a pattern from earlier checks. It never diagnoses from them alone.</p></div>'+
    '<div style="margin-top:14px"><button class="btn2" id="psave">Save profile</button></div>';
}
function bindSheetExtra(v){
  sh.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("lia-mode",b.dataset.m)}catch(e){}sheet("set")});
  sh.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("lia-pause",b.dataset.p)}catch(e){}sheet("set")});
  const pk=$("pkey");if(pk)pk.onclick=()=>{capturing=true;pk.textContent="Press a key…";addEventListener("keydown",cap,{capture:true,once:true})};
  const pg=$("pgo");if(pg)pg.onclick=()=>sheet("profile");
  if(v==="profile"){
    $("psave").onclick=()=>{const all=loadProfiles();all[who||"guest"]={conditions:$("pf_c").value.trim(),allergies:$("pf_a").value.trim(),medications:$("pf_m").value.trim(),notes:$("pf_n").value.trim()};try{localStorage.setItem("lia-profiles",JSON.stringify(all))}catch(e){}toast("Profile saved");closeSheet()};
    sh.querySelectorAll("[data-ctx]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("lia-ctx",b.dataset.ctx)}catch(e){}sh.querySelectorAll("[data-ctx]").forEach(x=>x.classList.toggle("on",x===b))});
  }
}
function cap(e){
  e.preventDefault();e.stopImmediatePropagation();capturing=false;
  if(e.code!=="Escape"){try{localStorage.setItem("lia-key",e.code)}catch(x){}toast("Push-to-talk key: "+keyLabel())}
  sheet("set");
}
health().then(()=>{if(tts)fetch("/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:"Hello! I'm Lia. How are you feeling?"})}).catch(()=>{})});
start();
</script>
</body>
</html>
